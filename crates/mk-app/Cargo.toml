[package]
name = "mk-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Nexa MemKeeper 앱 — 상주 셸·온디맨드 워커 겸용 단일 bin (--worker 분기, DR-7)"
build = "build.rs"

# 배포 파일명 = 표시 이름과 일치시킨다(알림·작업 관리자에 mk-app.exe가 노출되지 않도록).
[[bin]]
name = "NexaMemKeeper"
path = "src/main.rs"

[dependencies]
mk-core = { workspace = true }

# windows = Win32 선언 전용 바인딩(DR-5 기본 허용 — docs/10 §3 원장). feature는 실사용분만.
[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

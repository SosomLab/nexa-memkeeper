# Release — 버전 태그 push → 게이트 통과 시 설치본·포터블 ZIP을 GitHub Release에 첨부.
# 태그 규약 = `0.5.0`(v 접두사 허용). 절차 SSOT = docs/20-packaging.md.
#
# 🔴 패키지 매니저 게시는 **기본 꺼져 있다**(사용자 지시 08-07).
#   - Chocolatey : 저장소 변수 `CHOCO_PUSH=true` + 시크릿 `CHOCO_API_KEY`가 모두 있을 때만 push.
#   - winget     : 저장소 변수 `WINGET_PUBLISH=true` + 시크릿 `WINGET_TOKEN`이 모두 있을 때만 PR.
#   변수가 없으면 **패키징까지만** 하고 산출물을 Release에 올린다 — 모더레이션 이중 큐를 피하기 위함.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch: # 수동 실행 = 게이트·아티팩트까지만(Release 생성은 태그 push에서만)

permissions:
  contents: write # Release 생성·자산 업로드

jobs:
  release:
    name: windows (게이트 → 포장 → Release)
    runs-on: windows-latest
    env:
      # 시크릿 미설정 시 빈 문자열 → 게시 단계는 조건에서 걸러진다.
      CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - run: cargo test --workspace
      - run: cargo build --release

      - name: 버전 결정 — 태그에서(수동 실행은 0.0.0)
        id: ver
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0" }
          "version=$ver" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Output "release version = $ver"

      # pack.ps1이 예산 게이트(DR-8)·포터블 ZIP·설치본·SHA256SUMS를 한 번에 만든다.
      # windows-latest 이미지에는 Inno Setup 6이 들어 있어 설치본까지 생성된다.
      - name: 포장 — 예산 게이트 + 포터블 ZIP + 설치본 (docs/20 §2)
        shell: pwsh
        run: pwsh packaging/pack.ps1 -SkipBuild

      # 게시 스위치 상태를 눈으로 확인하기 위한 단계 — 값은 절대 찍지 않고 **설정 여부만** 본다.
      # (시크릿은 API로 조회할 수 없어, 릴리스를 걸기 전에 이 출력으로 상태를 확인한다.)
      - name: 게시 스위치 상태 (값 노출 없음 — docs/20 §7-1)
        shell: pwsh
        env:
          HAS_CHOCO_KEY: ${{ secrets.CHOCO_API_KEY != '' }}
          HAS_WINGET_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
          VAR_CHOCO_PUSH: ${{ vars.CHOCO_PUSH }}
          VAR_WINGET_PUBLISH: ${{ vars.WINGET_PUBLISH }}
        run: |
          Write-Output "secrets.CHOCO_API_KEY  설정됨 : $env:HAS_CHOCO_KEY"
          Write-Output "secrets.WINGET_TOKEN   설정됨 : $env:HAS_WINGET_TOKEN"
          Write-Output "vars.CHOCO_PUSH               : '$env:VAR_CHOCO_PUSH'  (true일 때만 choco push)"
          Write-Output "vars.WINGET_PUBLISH           : '$env:VAR_WINGET_PUBLISH'  (true일 때만 winget PR)"

      - name: 산출물 확인
        shell: pwsh
        run: Get-ChildItem target/pack -File | Select-Object Name, Length | Format-Table -AutoSize

      # ── Chocolatey: nupkg는 바이너리를 동봉하지 않고 Release 자산을 내려받는다
      #    (PolyForm NC = 비-FOSS → 커뮤니티 저장소 규정상 공식 URL 다운로드가 정석).
      - name: Chocolatey nupkg 팩 — 버전·체크섬 주입 (게시와 무관하게 항상 수행)
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $pkgs = @(
            @{ Id = "nexa-memkeeper";          Asset = "target\pack\NexaMemKeeper-$ver-setup.exe" }
            @{ Id = "nexa-memkeeper.portable"; Asset = "target\pack\NexaMemKeeper-$ver-portable.zip" }
          )
          foreach ($p in $pkgs) {
            $sha = (Get-FileHash -Algorithm SHA256 $p.Asset).Hash.ToLower()
            Write-Output "$($p.Id): $($p.Asset) SHA-256 = $sha"
            $ps1 = "packaging\chocolatey\$($p.Id)\tools\chocolateyinstall.ps1"
            (Get-Content $ps1 -Raw).Replace("{{VERSION}}", $ver).Replace("{{CHECKSUM64}}", $sha) |
              Set-Content $ps1 -NoNewline
            choco pack "packaging\chocolatey\$($p.Id)\$($p.Id).nuspec" --version $ver `
              --outputdirectory packaging\chocolatey\out
            if ($LASTEXITCODE -ne 0) { throw "choco pack 실패($($p.Id)): $LASTEXITCODE" }
          }

      # 저장소 변수 CHOCO_PUSH='true'일 때만 게시(기본 = 게시 안 함, 사용자 지시 08-07).
      # 준비되면 Settings > Variables에 CHOCO_PUSH=true를 넣기만 하면 된다(코드 무변경).
      - name: Chocolatey 커뮤니티 저장소 push (CHOCO_PUSH 변수 + 시크릿 있을 때만)
        if: github.ref_type == 'tag' && env.CHOCO_API_KEY != '' && vars.CHOCO_PUSH == 'true'
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          foreach ($id in @("nexa-memkeeper", "nexa-memkeeper.portable")) {
            choco push "packaging\chocolatey\out\$id.$ver.nupkg" `
              --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
            if ($LASTEXITCODE -ne 0) { throw "choco push 실패($id): $LASTEXITCODE" }
          }

      - name: GitHub Release 생성·자산 첨부 (태그 push에서만)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/pack/NexaMemKeeper-*-setup.exe
            target/pack/NexaMemKeeper-*-portable.zip
            target/pack/SHA256SUMS.txt
          generate_release_notes: true

      # ── winget: 매니페스트 PR은 **Release 자산이 올라간 뒤**에야 만들 수 있다(URL·해시 참조).
      #    wingetcreate가 microsoft/winget-pkgs 포크에 PR을 연다 — 토큰·변수 둘 다 있을 때만.
      - name: winget 매니페스트 PR (WINGET_PUBLISH 변수 + 토큰 있을 때만)
        if: github.ref_type == 'tag' && env.WINGET_TOKEN != '' && vars.WINGET_PUBLISH == 'true'
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/NexaMemKeeper-$ver-setup.exe"
          curl.exe -L -o wingetcreate.exe https://aka.ms/wingetcreate/latest
          .\wingetcreate.exe update SosomLab.NexaMemKeeper `
            --version $ver --urls "$url|x64|machine" --submit --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate 실패: $LASTEXITCODE" }

      - uses: actions/upload-artifact@v7
        with:
          name: NexaMemKeeper-release
          path: |
            target/pack/*.exe
            target/pack/*.zip
            target/pack/SHA256SUMS.txt
            packaging/chocolatey/out/*.nupkg
